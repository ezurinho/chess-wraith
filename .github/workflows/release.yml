name: release

# Manual on purpose: a tag changes what every installed copy downloads next,
# and the engine URL points at that tag. One button, one version, one check run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (the CHANGELOG section must already exist)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node --check tools/build.js
      - run: node --check tools/release.js
      - run: npm run check

      - name: Prepare the version
        run: |
          node tools/release.js prepare "${{ inputs.version }}"
          node --check chess-wraith.user.js
          node tools/release.js check

      - name: Commit and tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add package.json package-lock.json src README.md CHANGELOG.md chess-wraith.user.js chess-wraith.meta.js update.json
          git commit -m "release: ${{ inputs.version }} [skip ci]"
          git tag -a "v${{ inputs.version }}" -m "CHESS WRAITH ${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/release.js notes "${{ inputs.version }}" > .release-notes.md
          gh release create "v${{ inputs.version }}" --verify-tag \
            --title "CHESS WRAITH — ${{ inputs.version }}" \
            --notes-file .release-notes.md \
            chess-wraith.user.js chess-wraith.meta.js update.json
